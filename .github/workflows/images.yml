name: Images

# The one job that builds the images, for build.yml, which calls it twice:
# without `publish` on pull requests and with it on main and v* tags.
#
# Both targets of docker/Dockerfile (context: the repo root) are built for
# linux/amd64 and loaded, then run the way the cluster runs them: as UID 10001,
# on a read-only root with a writable /tmp, secrets as files, migrations as a
# database owner that is not a superuser. With `publish`, the images that
# passed are pushed as they are, from this job's own Docker: what is published
# is what was tested, never a rebuild.
#
# No `permissions` here, on purpose. A called workflow can only narrow the
# token its caller grants: `contents: read` here would strip the publishing
# caller's `packages: write`, and `packages: write` here would fail the
# pull-request caller, which grants none. build.yml decides.

on:
  workflow_call:
    inputs:
      publish:
        description: Push the tested images to GHCR. The calling job must grant `packages write`.
        type: boolean
        required: true

env:
  APP_IMAGE: ghcr.io/wlargou/mailviz/app
  MIGRATOR_IMAGE: ghcr.io/wlargou/mailviz/migrator

jobs:
  images:
    runs-on: ubuntu-latest
    # A cold build is a few minutes natively (under QEMU on a Mac, about 3 for
    # the app), and a push about one more. 30 stops a wedged run, not a slow one.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `sha-<7>` names the commit; VERSION names the release. Built with both
      # tags whether or not it publishes, so a pull request tests exactly what
      # main will push. The VERSION tag moves: any later or concurrent build of a
      # commit carrying the same VERSION re-pushes it, so it may name an older
      # commit's image. Only the sha tag and the digest are stable.
      - name: Name the images
        id: names
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not major.minor.patch.build: $version"; exit 1; }
          sha_tag=sha-${GITHUB_SHA::7}
          {
            echo "IMAGE_VERSION=$version"
            echo "SHA_TAG=$sha_tag"
          } >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "app<<EOF"
            echo "$APP_IMAGE:$sha_tag"
            echo "$APP_IMAGE:$version"
            echo "EOF"
            echo "migrator<<EOF"
            echo "$MIGRATOR_IMAGE:$sha_tag"
            echo "$MIGRATOR_IMAGE:$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The two targets share every stage up to their own, so the second build
      # reuses the first's layers from this builder. The GitHub Actions cache
      # carries them to the next run, one scope per target so that neither
      # overwrites the other's. The labels are in the build, not added at push:
      # a label is part of the image, and adding one would make a new image.
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.names.outputs.app }}
          # The source label is also what links the GHCR package to this
          # repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=app

      - name: Build the migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.names.outputs.migrator }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: |
            type=gha,scope=migrator
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=migrator

      # Throwaway values, generated here and never printed. Mounted read-only
      # the way the cluster mounts its Secrets.
      - name: Secrets as files
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir"
          password=$(openssl rand -hex 16)
          for name in JWT_SECRET JWT_REFRESH_SECRET TOKEN_ENCRYPTION_KEY; do
            openssl rand -hex 32 > "$dir/$name"
          done
          printf 'postgresql://productivity_hub:%s@127.0.0.1:5432/productivity_hub?schema=public\n' "$password" > "$dir/DATABASE_URL"
          chmod 0444 "$dir"/*
          # The owner CNPG will create: owns its database, is not a superuser.
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          CREATE ROLE productivity_hub LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$password';
          CREATE DATABASE productivity_hub OWNER productivity_hub;
          SQL
          echo "SECRETS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Smoke-test the migrator image
        run: |
          set -euo pipefail
          migrate() {
            docker run --rm --network host --read-only --tmpfs /tmp \
              -v "$SECRETS_DIR:/var/run/secrets/app:ro" \
              -e DATABASE_URL_FILE=/var/run/secrets/app/DATABASE_URL \
              "$MIGRATOR_IMAGE:$SHA_TAG" "$@"
          }
          migrate --version
          migrate                    # the default command: migrate deploy
          migrate migrate status

      - name: Smoke-test the app image
        run: |
          set -euo pipefail
          s=/var/run/secrets/app
          # Production refuses a localhost CLIENT_URL or redirect URI (1.29.1), so the smoke
          # test names a public-looking host it never visits: every check below is a GET to
          # localhost, which the Origin check does not apply to. RUN_SCHEDULERS=false keeps
          # the five background jobs off.
          docker run -d --name app --network host --read-only --tmpfs /tmp \
            -v "$SECRETS_DIR:$s:ro" \
            -e DATABASE_URL_FILE="$s/DATABASE_URL" \
            -e JWT_SECRET_FILE="$s/JWT_SECRET" \
            -e JWT_REFRESH_SECRET_FILE="$s/JWT_REFRESH_SECRET" \
            -e TOKEN_ENCRYPTION_KEY_FILE="$s/TOKEN_ENCRYPTION_KEY" \
            -e CLIENT_URL=https://smoke.invalid \
            -e GOOGLE_REDIRECT_URI=https://smoke.invalid/api/v1/auth/google/callback \
            -e RUN_SCHEDULERS=false \
            -e EMAIL_SYNC_ENABLED=false \
            -e CALENDAR_SYNC_ENABLED=false \
            "$APP_IMAGE:$SHA_TAG"
          trap 'docker logs app; docker rm -f app >/dev/null' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3002/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3002/api/health
          echo

          # The version it reports is the VERSION it was built from.
          served=$(curl -fsS http://localhost:3002/api/version | jq -r .data.version)
          test "$served" = "$IMAGE_VERSION" || { echo "::error::/api/version says $served, VERSION says $IMAGE_VERSION"; exit 1; }

          # NODE_ENV=production serves the client from /app/client/dist.
          page=$(curl -fsS http://localhost:3002/)
          [[ "$page" == *'<div id="root">'* ]] || { echo "::error::/ did not serve the client"; exit 1; }

          # The API is mounted behind its auth middleware.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/v1/tasks)
          test "$status" = 401 || { echo "::error::/api/v1/tasks answered $status, expected 401"; exit 1; }

          # And the server's own Prisma client reaches the migrated database as
          # the owner, through DATABASE_URL_FILE: nothing public touches it.
          docker exec app node --input-type=module -e "
            const { prisma } = await import('/app/server/dist/lib/prisma.js');
            console.log('users:', await prisma.user.count());
            await prisma.\$disconnect();
          "

      # Everything below runs only when publishing, and only after every check
      # above has passed: the registry login comes after the tests, not before.
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `docker push` of the images loaded and tested above: no build step runs
      # in between. Each image's two tags must name one digest, the one the
      # mirror pins.
      - name: Push the tested images
        if: inputs.publish
        id: push
        run: |
          set -euo pipefail
          # Every failure is passed up by hand (`|| return 1`): bash clears
          # `set -e` inside $( ), so a failed push would otherwise come back as
          # an empty digest and the step would go on.
          #
          # Pushes one tag; prints the digest the registry reports for it.
          push() {
            local out digest
            out=$(docker push "$1") || return 1
            printf '%s\n' "$out" >&2
            digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$out" | tail -n 1)
            [[ -n "$digest" ]] || { echo "::error::the push of $1 reported no digest" >&2; return 1; }
            echo "$digest"
          }
          # Pushes both tags of one image; prints their digest, which must be one.
          publish() {
            local by_sha by_version
            by_sha=$(push "$1:$SHA_TAG") || return 1
            by_version=$(push "$1:$IMAGE_VERSION") || return 1
            [[ "$by_version" == "$by_sha" ]] || { echo "::error::$1:$SHA_TAG is $by_sha but $1:$IMAGE_VERSION is $by_version" >&2; return 1; }
            echo "$by_sha"
          }
          app=$(publish "$APP_IMAGE")
          migrator=$(publish "$MIGRATOR_IMAGE")
          {
            echo "app=$app"
            echo "migrator=$migrator"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: inputs.publish
        env:
          APP_DIGEST: ${{ steps.push.outputs.app }}
          MIGRATOR_DIGEST: ${{ steps.push.outputs.migrator }}
        run: |
          {
            echo "### Images for ${GITHUB_SHA::7} (VERSION $IMAGE_VERSION)"
            echo
            echo "These are the images the smoke test ran, pushed as they were tested."
            echo
            echo "| Image | Tags | Digest |"
            echo "|---|---|---|"
            echo "| \`$APP_IMAGE\` | \`$SHA_TAG\`, \`$IMAGE_VERSION\` | \`$APP_DIGEST\` |"
            echo "| \`$MIGRATOR_IMAGE\` | \`$SHA_TAG\`, \`$IMAGE_VERSION\` | \`$MIGRATOR_DIGEST\` |"
            echo
            echo "Pin by digest, never by the VERSION tag, which moves: \`$APP_IMAGE@$APP_DIGEST\`, \`$MIGRATOR_IMAGE@$MIGRATOR_DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"
