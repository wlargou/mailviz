name: Build

# The container images, from docker/Dockerfile with the repo root as the
# context, for linux/amd64:
#   ghcr.io/wlargou/mailviz/app       the server, serving the client
#   ghcr.io/wlargou/mailviz/migrator  `prisma migrate deploy`, run before a rollout
# A script in olympusx-hosting mirrors them to OCIR and pins each by digest.
# Railway does not use them: it keeps building with Nixpacks until the move,
# which is why the Dockerfile is not at the root (Railway builds with a root
# Dockerfile whenever it finds one).
#
# Built on GitHub-hosted runners and never on a self-hosted one: these are what
# production runs, so they come from a fresh VM, not from a machine that also
# runs pull-request code. ubuntu-latest is amd64, so nothing is emulated.

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'package*.json'
      - 'client/**'
      - 'server/**'
      - VERSION
      - .github/workflows/build.yml
  # Every commit on main gets images named after it, whatever it touched, so
  # `sha-<commit>` exists for every commit of main.
  push:
    branches: [main]
    tags: ['v*']
  # On main or a tag this publishes; on any other ref it is a dry run, which is
  # how a change to this file is tried before it merges.
  workflow_dispatch:

# Read-only by default. Only `publish` pushes, and only it asks for
# packages: write.
permissions:
  contents: read

# Pull requests: one group per pull request, and a new push cancels the run it
# replaces. Everything else — main, tags, a dispatch — gets a group of its own
# per ref and commit. GitHub keeps one pending run per group and cancels the
# older, so a shared group on main would drop a commit's images whenever two
# merges queued behind a running build; one group per commit is never shared,
# and so never cancelled. Two commits of main can therefore publish at once:
# their sha tags differ, and the VERSION tag (shared only when a merge changes
# no shipped code) may land on either, which is why the mirror pins digests.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.ref) || format('build-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_IMAGE: ghcr.io/wlargou/mailviz/app
  MIGRATOR_IMAGE: ghcr.io/wlargou/mailviz/migrator

jobs:
  # Both images, built and loaded locally, then run the way the cluster runs
  # them: as UID 10001, on a read-only root with a writable /tmp, secrets as
  # files, migrations as a database owner that is not a superuser. Pushes
  # nothing, whatever the ref.
  build:
    runs-on: ubuntu-latest
    # A cold build is a few minutes natively (under QEMU on a Mac, about 3 for
    # the app). 30 stops a wedged build, not a slow one.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The two targets share every stage up to their own, so the second build
      # reuses the first's layers from this builder. The GitHub Actions cache
      # carries them to the next run, one scope per target so that neither
      # overwrites the other's.
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/amd64
          load: true
          push: false
          tags: mailviz-app:ci
          cache-from: |
            type=gha,scope=app
            type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=app

      - name: Build the migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          load: true
          push: false
          tags: mailviz-migrator:ci
          cache-from: |
            type=gha,scope=migrator
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=migrator

      # Throwaway values, generated here and never printed. Mounted read-only
      # the way the cluster mounts its Secrets.
      - name: Secrets as files
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir"
          password=$(openssl rand -hex 16)
          for name in JWT_SECRET JWT_REFRESH_SECRET TOKEN_ENCRYPTION_KEY; do
            openssl rand -hex 32 > "$dir/$name"
          done
          printf 'postgresql://productivity_hub:%s@127.0.0.1:5432/productivity_hub?schema=public\n' "$password" > "$dir/DATABASE_URL"
          chmod 0444 "$dir"/*
          # The owner CNPG will create: owns its database, is not a superuser.
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres <<SQL
          CREATE ROLE productivity_hub LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$password';
          CREATE DATABASE productivity_hub OWNER productivity_hub;
          SQL
          echo "SECRETS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Smoke-test the migrator image
        run: |
          set -euo pipefail
          migrate() {
            docker run --rm --network host --read-only --tmpfs /tmp \
              -v "$SECRETS_DIR:/var/run/secrets/app:ro" \
              -e DATABASE_URL_FILE=/var/run/secrets/app/DATABASE_URL \
              mailviz-migrator:ci "$@"
          }
          migrate --version
          migrate                    # the default command: migrate deploy
          migrate migrate status

      - name: Smoke-test the app image
        run: |
          set -euo pipefail
          s=/var/run/secrets/app
          docker run -d --name app --network host --read-only --tmpfs /tmp \
            -v "$SECRETS_DIR:$s:ro" \
            -e DATABASE_URL_FILE="$s/DATABASE_URL" \
            -e JWT_SECRET_FILE="$s/JWT_SECRET" \
            -e JWT_REFRESH_SECRET_FILE="$s/JWT_REFRESH_SECRET" \
            -e TOKEN_ENCRYPTION_KEY_FILE="$s/TOKEN_ENCRYPTION_KEY" \
            -e CLIENT_URL=http://localhost:3002 \
            -e GOOGLE_REDIRECT_URI=http://localhost:3002/api/v1/auth/google/callback \
            -e EMAIL_SYNC_ENABLED=false \
            -e CALENDAR_SYNC_ENABLED=false \
            mailviz-app:ci
          trap 'docker logs app; docker rm -f app >/dev/null' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3002/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3002/api/health
          echo

          # The version it reports is the VERSION it was built from.
          served=$(curl -fsS http://localhost:3002/api/version | jq -r .data.version)
          test "$served" = "$(cat VERSION)" || { echo "::error::/api/version says $served, VERSION says $(cat VERSION)"; exit 1; }

          # NODE_ENV=production serves the client from /app/client/dist.
          page=$(curl -fsS http://localhost:3002/)
          [[ "$page" == *'<div id="root">'* ]] || { echo "::error::/ did not serve the client"; exit 1; }

          # The API is mounted behind its auth middleware.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/v1/tasks)
          test "$status" = 401 || { echo "::error::/api/v1/tasks answered $status, expected 401"; exit 1; }

          # And the server's own Prisma client reaches the migrated database as
          # the owner, through DATABASE_URL_FILE: nothing public touches it.
          docker exec app node --input-type=module -e "
            const { prisma } = await import('/app/server/dist/lib/prisma.js');
            console.log('users:', await prisma.user.count());
            await prisma.\$disconnect();
          "

  # main and v* tags only. Rebuilds both targets from the cache `build` just
  # wrote — the same commit, normally the same layers — and pushes them. Its
  # digests, in the summary, are what the mirror pins.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `sha-<7>` names the commit; VERSION names the release. A later build of
      # the same VERSION (a tag on that commit, or a merge that changes no
      # shipped code and so bumps nothing) moves the VERSION tag, never the
      # sha tag's commit.
      - name: Name the images
        id: names
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not major.minor.patch.build: $version"; exit 1; }
          sha7=${GITHUB_SHA::7}
          {
            echo "version=$version"
            echo "app<<EOF"
            echo "$APP_IMAGE:sha-$sha7"
            echo "$APP_IMAGE:$version"
            echo "EOF"
            echo "migrator<<EOF"
            echo "$MIGRATOR_IMAGE:sha-$sha7"
            echo "$MIGRATOR_IMAGE:$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the app image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.app }}
          # The source label is also what links the GHCR package to this
          # repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=migrator

      - name: Push the migrator image
        id: migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.migrator }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: |
            type=gha,scope=migrator
            type=gha,scope=app

      - name: Summary
        env:
          VERSION: ${{ steps.names.outputs.version }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          {
            echo "### Images for ${GITHUB_SHA::7} (VERSION $VERSION)"
            echo
            echo "| Image | Tags | Digest |"
            echo "|---|---|---|"
            echo "| \`$APP_IMAGE\` | \`sha-${GITHUB_SHA::7}\`, \`$VERSION\` | \`$APP_DIGEST\` |"
            echo "| \`$MIGRATOR_IMAGE\` | \`sha-${GITHUB_SHA::7}\`, \`$VERSION\` | \`$MIGRATOR_DIGEST\` |"
            echo
            echo "Pin by digest: \`$APP_IMAGE@$APP_DIGEST\`, \`$MIGRATOR_IMAGE@$MIGRATOR_DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"
