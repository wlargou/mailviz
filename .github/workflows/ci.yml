name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only for every job: nothing here writes to the repository or a registry.
# A job that needs more asks for it itself, so a job added later inherits none.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. main is never
# cancelled mid-run — every merge is verified — though a burst of merges keeps
# only the newest of the runs still waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # npm ci runs Carbon's and IBM Plex's postinstalls, which report to IBM from
  # CI; the Prisma CLI reports to checkpoint.prisma.io.
  IBM_TELEMETRY_DISABLED: 'true'
  CHECKPOINT_DISABLE: '1'

# Actions are pinned to a full commit SHA, the version in the comment;
# .github/dependabot.yml proposes the updates.
jobs:
  # Every deploy should be identifiable, and nothing derives the version at
  # runtime — the container has no .git and Railway exposes no commit SHA, both
  # checked. So VERSION is only ever accurate because it travelled with the
  # code, and this is what makes sure it did.
  #
  # A separate job from `verify` on purpose: it needs no database, no install
  # and no build, so it answers in seconds and says exactly one thing.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # It takes about 6 seconds.
    timeout-minutes: 5
    steps:
      # The comparison needs both branches, so the default shallow clone will
      # not do.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require a VERSION bump when app code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          # Three dots: what THIS branch changed since it diverged, not
          # everything that has landed on the base since.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")

          # Only shipped code counts. A PR that touches nothing but tests,
          # docs or CI changes what is deployed in no observable way, and
          # demanding a version bump for those trains people to bump without
          # meaning it.
          app_changed=$(echo "$changed" | grep -E '^(client|server)/' | grep -vE '\.(test|spec)\.[tj]sx?$|^server/src/test/' || true)

          if [ -z "$app_changed" ]; then
            echo "No shipped code changed — no VERSION bump needed."
            exit 0
          fi

          if echo "$changed" | grep -qx 'VERSION'; then
            echo "VERSION bumped to $(cat VERSION) alongside:"
            echo "$app_changed" | sed 's/^/  /'
            exit 0
          fi

          echo "::error::This PR changes shipped code but does not bump VERSION."
          echo ""
          echo "Files that ship:"
          echo "$app_changed" | sed 's/^/  /'
          echo ""
          echo "VERSION is major.minor.patch.build and is currently $(cat VERSION)."
          echo "Nothing derives it at runtime, so a deploy is only identifiable"
          echo "if the bump travels in the same commit. Bump the last component"
          echo "for a rebuild, or a higher one for a real change."
          exit 1

  verify:
    runs-on: ubuntu-latest
    # Green runs take 11–16 minutes, but one took 41 (run 35711013336, 39 of
    # them in Test server), so 45 would have been too tight.
    timeout-minutes: 60

    services:
      postgres:
        # Production's major version, and Debian rather than Alpine: production
        # runs PostgreSQL 18 on glibc with en_US.utf8, and Alpine's musl has no
        # libc locales, so mail search's lower() and text ordering were being
        # tested under a different collation.
        image: postgres:18
        env:
          POSTGRES_USER: mailviz
          POSTGRES_PASSWORD: mailviz_dev
          POSTGRES_DB: mailviz_db
        ports:
          - 5432:5432
        # -h 127.0.0.1: over the unix socket, pg_isready also answers for the
        # temporary server the image runs during initdb, which then restarts.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mailviz -d mailviz_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mailviz:mailviz_dev@localhost:5432/mailviz_db?schema=public
      # The suite creates and drops its OWN database per run (see
      # src/test/databaseUrl.ts) — it only needs to know where the server is.
      # Setting TEST_DATABASE_URL instead would pin one database and disable
      # that isolation.
      TEST_DATABASE_BASE_URL: postgresql://mailviz:mailviz_dev@localhost:5432/postgres?schema=public

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server

      # Catches drift between schema.prisma and the committed migrations, and
      # proves the migration chain applies to an EMPTY database — which is how
      # a new clone and a first deploy both start. That was genuinely broken:
      # a migration backfilled user_id from an empty users table and then set
      # the column NOT NULL.
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=src/prisma/schema.prisma
        working-directory: server

      # esbuild and Vite strip types without checking them, so the build alone
      # proves nothing. This is the gate that actually reads the types.
      - name: Typecheck server
        run: npm run typecheck --workspace=server

      - name: Typecheck client
        run: npm run typecheck --workspace=client

      - name: Test server
        run: npm run test --workspace=server

      - name: Test client
        run: npm run test --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  # `verify` migrates as the image's superuser. Production will not: CNPG
  # creates the database with an owner role that is not a superuser
  # (productivity_hub), and migrations run as that role. A migration that needs
  # a superuser — ALTER SYSTEM, an untrusted extension, anything on another
  # role's object — passes `verify` and fails at the first deploy. This is
  # where it fails first. pg_trgm and unaccent are trusted extensions, so the
  # owner may create them.
  migrations-as-owner:
    runs-on: ubuntu-latest
    # About a minute: an install and 64 migrations.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the owner, as CNPG does
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE ROLE productivity_hub LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-throwaway';
          CREATE DATABASE productivity_hub OWNER productivity_hub;
          SQL

      - name: Apply every migration as that owner
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://productivity_hub:ci-throwaway@localhost:5432/productivity_hub?schema=public
