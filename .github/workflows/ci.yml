name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailviz
          POSTGRES_PASSWORD: mailviz_dev
          POSTGRES_DB: mailviz_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailviz -d mailviz_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mailviz:mailviz_dev@localhost:5432/mailviz_db?schema=public
      # The suite truncates every table between tests, so it gets its own
      # database. globalSetup refuses to run against a name not ending in _test.
      TEST_DATABASE_URL: postgresql://mailviz:mailviz_dev@localhost:5432/mailviz_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server

      # Catches drift between schema.prisma and the committed migrations, and
      # proves the migration chain applies to an EMPTY database — which is how
      # a new clone and a first deploy both start. That was genuinely broken:
      # a migration backfilled user_id from an empty users table and then set
      # the column NOT NULL.
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=src/prisma/schema.prisma
        working-directory: server

      - name: Create test database
        run: PGPASSWORD=mailviz_dev psql -h localhost -U mailviz -d postgres -c 'CREATE DATABASE mailviz_test OWNER mailviz;'

      # esbuild and Vite strip types without checking them, so the build alone
      # proves nothing. This is the gate that actually reads the types.
      - name: Typecheck server
        run: npm run typecheck --workspace=server

      - name: Typecheck client
        run: npm run typecheck --workspace=client

      - name: Test server
        run: npm run test --workspace=server

      - name: Test client
        run: npm run test --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
